[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pick-prophet"
version = "0.1.0"
description = "Leakage-aware college football Pick'em research pipeline"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "scikit-learn>=1.5,<2", "scipy>=1.11,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=4"]
notebook = ["jupyterlab>=4", "matplotlib>=3.9"]

[project.scripts]
pick-prophet = "pick_prophet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
